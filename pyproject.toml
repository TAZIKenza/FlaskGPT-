[project]
name = "flaskgpt"
version = "0.1.0"
description = "FlaskGPT : assistant IA (Flask + Tailwind + SQLite + API Groq)"
requires-python = ">=3.14,<4"
dependencies = [
    "flask>=3.0",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "pypdf>=4.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
